services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfrete-pro
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
    ports:
      - "${PORT_BIND:-80}:8080"
    volumes:
      - ./data:/app/data

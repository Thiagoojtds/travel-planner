services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfrete-pro
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - API_PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

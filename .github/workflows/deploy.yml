name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy TransFrete Pro to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_TARGET_DIR }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "🚀 Iniciando deploy em: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Se ainda não for repositório git, inicializa no diretório existente
            if [ ! -d ".git" ]; then
              echo "📦 Inicializando Git no diretório existente..."
              git init
              git config --global --add safe.directory "$APP_DIR" || true
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
            else
              git config --global --add safe.directory "$APP_DIR" || true
              git remote set-url origin "$REPO_URL"
            fi

            echo "🔄 Sincronizando código com a branch $BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git checkout -B "$BRANCH" || true

            echo "📁 Garantindo diretório de dados persistentes..."
            mkdir -p data

            echo "🛑 Parando containers antigos e removendo órfãos (ex: caddy-proxy)..."
            docker compose down --remove-orphans || true

            echo "🐳 Subindo nova versão do TransFrete Pro..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Limpando imagens docker antigas..."
            docker image prune -f

            echo "✅ Deploy concluído com sucesso!"
